<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فحص المحتوى — هل Pages CMS مسح حاجة؟</title>
<style>
  :root{--ink:#0A0A0B;--paper:#F1EEE6;--accent:#E4572E;--amber:#F2A93B;--sage:#5C6E58}
  *{box-sizing:border-box}
  body{margin:0;padding:28px 20px 60px;background:var(--ink);color:var(--paper);
       font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;line-height:1.6}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:1.5rem;margin:0 0 6px;letter-spacing:-.02em}
  .sub{color:rgba(241,238,230,.5);font-size:.82rem;margin:0 0 22px}
  button{font:inherit;font-size:.78rem;padding:12px 20px;border:1px solid rgba(241,238,230,.25);
         background:transparent;color:var(--paper);cursor:pointer;border-radius:2px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button:hover{opacity:.85}
  #out{margin-top:24px}
  .row{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid rgba(241,238,230,.1);
       font-size:.8rem;align-items:baseline}
  .row .k{flex:0 0 190px;color:rgba(241,238,230,.5);font-family:ui-monospace,monospace;font-size:.72rem}
  .row .v{flex:1;word-break:break-word}
  .ok{color:var(--sage)} .bad{color:var(--accent)} .warn{color:var(--amber)}
  .verdict{padding:16px 18px;border-left:3px solid var(--accent);background:rgba(228,87,46,.08);
           margin:22px 0;font-size:.86rem}
  .verdict.good{border-color:var(--sage);background:rgba(92,110,88,.1)}
  .verdict b{display:block;font-size:1rem;margin-bottom:6px}
  pre{background:#111;padding:14px;overflow:auto;font-size:.7rem;border:1px solid rgba(241,238,230,.12);
      max-height:260px}
  .note{font-size:.72rem;color:rgba(241,238,230,.4);margin-top:26px}
  code{background:rgba(241,238,230,.1);padding:1px 5px;font-size:.75em}
</style>
</head>
<body>
<div class="wrap">
  <h1>فحص المحتوى</h1>
  <p class="sub">افتح الملف ده من فولدر الموقع (اللي فيه <code>content/</code>). بيقرا الملفات محليًا — مفيش رفع، مفيش إنترنت.</p>

  <button class="primary" id="run">ابدأ الفحص</button>
  <div id="out"></div>

  <p class="note">
    مهم: لازم تفتحه من سيرفر محلي، مش بالدبل-كليك. من الفولدر:<br>
    <code>python -m http.server 8000</code> بعدين افتح <code>localhost:8000/CHECK-CONTENT.html</code>
  </p>
</div>

<script>
const REQUIRED = {
  'content/seo.json':     [['meta','عنوان الموقع (SEO)']],
  'content/person.json':  [['person','بياناتك الشخصية']],
  'content/hero.json':    [['hero','أول شاشة']],
  'content/about.json':   [['about','قسم عني']],
  'content/contact.json': [['contact','التواصل']],
  'content/projects.json':[['order','ترتيب المشاريع']],
  'content/acts.json':    [['order','ترتيب الفصول']]
};
// الحقول الحيوية جوه كل كائن — لو ضاعت، الصفحة بتبان ناقصة
const VITAL = {
  'meta.title':        'عنوان التاب (SEO)',
  'meta.description':  'وصف البحث',
  'meta.ogImage':      'صورة المشاركة',
  'person.name':       'اسمك',
  'person.email':      'الإيميل',
  'person.whatsapp':   'رقم الواتساب',
  'person.years':      'سنين الخبرة',
  'hero.status':       'سطر الحالة',
  'about.statement':   'فقرة عني',
  'about.stats':       'الأرقام',
  'about.tools':       'الأدوات',
  'contact.socials':   'لينكات السوشيال',
  'contact.emailCta':  'زر الإيميل'
};

function get(o,p){return p.split('.').reduce((a,k)=>a==null?undefined:a[k],o)}

async function run(){
  const out=document.getElementById('out');
  out.innerHTML='<p class="sub">بيفحص…</p>';
  let html='', missing=[], broken=[], empty=[], good=0;

  for(const [file, expect] of Object.entries(REQUIRED)){
    let data=null, err=null;
    try{
      const r=await fetch(file,{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      data=await r.json();
    }catch(e){ err=e.message; }

    if(!data){
      broken.push(file);
      html+=`<div class="row"><span class="k">${file}</span><span class="v bad">✗ ${err==='HTTP 404'?'الملف مش موجود — لسه مرفعتوش':'ملف بايظ: '+err}</span></div>`;
      continue;
    }

    for(const [key,label] of expect){
      if(!(key in data)){
        missing.push(file+' → '+key);
        html+=`<div class="row"><span class="k">${file}</span><span class="v bad">✗ ناقص: ${key} (${label})</span></div>`;
      } else {
        good++;
        const v=data[key];
        const isObj=v&&typeof v==='object';
        html+=`<div class="row"><span class="k">${file}</span><span class="v ok">✓ ${key} (${label})${isObj?' — '+Object.keys(v).length+' مفتاح':''}</span></div>`;
      }
    }
  }

  // فحص الحقول الحيوية جوه الكائنات
  let merged={};
  for(const file of Object.keys(REQUIRED)){
    try{
      const d=await (await fetch(file,{cache:'no-store'})).json();
      Object.assign(merged,d);
    }catch(e){}
  }
  let vital='';
  for(const [path,label] of Object.entries(VITAL)){
    const v=get(merged,path);
    const isEmpty = v==null || v==='' || (Array.isArray(v)&&!v.length);
    if(isEmpty){ empty.push(label); vital+=`<div class="row"><span class="k">${path}</span><span class="v bad">✗ فاضي — ${label}</span></div>`; }
    else vital+=`<div class="row"><span class="k">${path}</span><span class="v ok">✓ ${label}</span></div>`;
  }

  const totalProblems = missing.length+broken.length+empty.length;
  let verdict;
  if(totalProblems===0){
    verdict=`<div class="verdict good"><b>✓ المحتوى سليم بالكامل</b>
      كل الملفات موجودة وكل الحقول الحيوية مليانة. Pages CMS ممسحش حاجة — المشكلة كانت في طريقة عرض المحرر بس، وإصلاح التقسيم حلها.</div>`;
  } else if(broken.length || missing.length){
    verdict=`<div class="verdict"><b>✗ فيه ملفات ناقصة — المحتوى اتأثر</b>
      ${broken.length?`<div>ملفات مش موجودة: ${broken.join(', ')} (${broken.length})</div>`:''}
      ${missing.length?`<div>مفاتيح ناقصة: ${missing.join(', ')}</div>`:''}
      <div style="margin-top:10px">الحل: نزّل <code>site.zip</code> من المحادثة وفك ضغطه فوق الفولدر، بعدين <code>git add -A &amp;&amp; git commit &amp;&amp; git push</code>.</div></div>`;
  } else {
    verdict=`<div class="verdict"><b>⚠ الملفات موجودة بس فيه حقول فاضية</b>
      <div>${empty.join(' · ')}</div>
      <div style="margin-top:10px">لو دي كانت مليانة قبل، يبقى Pages CMS حفظ فوقها. افتح <code>content/${''}</code> وشوف القيمة.</div></div>`;
  }

  out.innerHTML = verdict
    + '<h3 style="font-size:.85rem;margin:22px 0 8px;color:rgba(241,238,230,.4)">الملفات</h3>' + html
    + '<h3 style="font-size:.85rem;margin:22px 0 8px;color:rgba(241,238,230,.4)">الحقول الحيوية</h3>' + vital;

  if(totalProblems){
    out.insertAdjacentHTML('beforeend','<h3 style="font-size:.85rem;margin:22px 0 8px;color:rgba(241,238,230,.4)">ملخص للنسخ</h3><pre id="copybox"></pre><button id="cp" style="margin-top:8px">انسخ الملخص</button>');
    document.getElementById('copybox').textContent =
      'ملفات ناقصة: '+(broken.join(', ')||'لا')+'\n'+
      'مفاتيح ناقصة: '+(missing.join(', ')||'لا')+'\n'+
      'حقول فاضية: '+(empty.join(', ')||'لا');
    document.getElementById('cp').onclick=()=>{
      navigator.clipboard.writeText(document.getElementById('copybox').textContent);
      document.getElementById('cp').textContent='اتنسخ ✓';
    };
  }
}
document.getElementById('run').onclick=run;
</script>
</body>
</html>
