<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — Youssef Mohamed</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0A0A0B" />
<link rel="stylesheet" href="/fonts.css" />
<style>
  :root{--ink:#0A0A0B;--paper:#F1EEE6;--accent:#E4572E;--muted:rgba(241,238,230,.55)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--ink);color:var(--paper);
       font-family:"Space Grotesk",system-ui,sans-serif;padding:24px;overflow:hidden;
       background-image:radial-gradient(100% 70% at 20% 90%,rgba(228,87,46,.14),transparent 60%)}
  .wrap{max-width:680px;width:100%;position:relative;z-index:2}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  h1{font-family:"Bricolage Grotesque","Space Grotesk",sans-serif;font-weight:600;letter-spacing:-.05em;
     font-size:clamp(4rem,18vw,9rem);line-height:.82;margin:10px 0 20px}
  h1 em{font-family:"Instrument Serif",Georgia,serif;font-style:italic;color:var(--accent)}
  p{color:var(--muted);line-height:1.6;margin:0 0 26px;max-width:44ch}
  a.btn{display:inline-flex;gap:.6em;align-items:center;background:var(--paper);color:var(--ink);
        padding:.85em 1.4em;border-radius:99px;text-decoration:none;font-family:"JetBrains Mono",monospace;
        font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;transition:background .3s,color .3s}
  a.btn:hover{background:var(--accent);color:#fff}
  .ghost{position:fixed;right:-6vw;top:50%;transform:translateY(-50%);font-family:"Bricolage Grotesque",sans-serif;
         font-weight:700;font-size:52vw;line-height:.7;color:transparent;-webkit-text-stroke:1px rgba(241,238,230,.07);pointer-events:none}
</style>
</head>
<body>
  <span class="ghost" aria-hidden="true">404</span>
  <div class="wrap">
    <p class="mono">ERROR 404</p>
    <h1>Page <em>missing</em></h1>
    <p>This URL doesn't exist — maybe it was a draft that never shipped. The real work is one click away.</p>
    <a class="btn" href="/">Back to the portfolio ↗</a>
  </div>
</body>
</html>
