<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — Youssef Mohamed</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0A0A0B" />
<link rel="stylesheet" href="fonts.css" />
<style>
  :root{--ink:#0A0A0B;--paper:#F1EEE6;--accent:#E4572E;--muted:rgba(241,238,230,.55)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--ink);color:var(--paper);
       font-family:"Space Grotesk",system-ui,sans-serif;padding:24px;
       background-image:radial-gradient(120% 80% at 80% 20%,rgba(228,87,46,.16),transparent 55%)}
  .wrap{max-width:620px;width:100%}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  h1{font-family:"Bricolage Grotesque","Space Grotesk",sans-serif;font-weight:600;letter-spacing:-.045em;
     font-size:clamp(2.6rem,9vw,5.2rem);line-height:.88;margin:14px 0 18px;text-transform:uppercase}
  h1 em{font-family:"Instrument Serif",Georgia,serif;font-style:italic;color:var(--accent);text-transform:none;letter-spacing:-.02em}
  p{color:var(--muted);line-height:1.6;margin:0 0 26px;max-width:46ch}
  a.btn{display:inline-flex;gap:.6em;align-items:center;background:var(--paper);color:var(--ink);
        padding:.85em 1.4em;border-radius:99px;text-decoration:none;font-family:"JetBrains Mono",monospace;
        font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;transition:background .3s,color .3s}
  a.btn:hover{background:var(--accent);color:#fff}
  .links{margin-top:22px;display:flex;gap:20px;font-size:.85rem}
  .links a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent;transition:.3s}
  .links a:hover{color:var(--paper);border-color:var(--accent)}
  .dot{width:64px;height:64px;border-radius:50%;border:1px solid rgba(241,238,230,.25);display:grid;place-items:center;margin-bottom:22px}
  .dot i{width:34px;height:34px;border-radius:50%;background:var(--accent);display:block}
</style>
</head>
<body>
  <div class="wrap">
    <div class="dot" aria-hidden="true"><i></i></div>
    <p class="mono">NO CONNECTION</p>
    <h1>You're <em>offline</em></h1>
    <p>The site is cached, but this page needs one request. Reconnect and everything comes back — the work, the Lab, all of it.</p>
    <a class="btn" href="./">Try again ↗</a>
    <div class="links">
      <a href="https://www.behance.net/65c12764" target="_blank" rel="noopener">Behance ↗</a>
      <a href="mailto:jomongy52@gmail.com">Email</a>
    </div>
  </div>
</body>
</html>
